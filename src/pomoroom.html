<title>Pomo Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800;900&display=swap">
<style>
/* Layout: room diorama + toolbar on top (phone) or left (wide); tabbed control panel below/right. */
:root{
  --bg:#E7ECF3; --surface:#FFFFFF; --ink:#1C2230; --muted:#5D6578; --line:#D3DAE5;
  --yellow:#F2B705; --yellow-ink:#2E2300; --red:#C8342B; --green:#2E8B57;
  --h0:#E3E8EF; --h1:#F9E3A1; --h2:#F5CB4E; --h3:#F2B705; --h4:#B88700;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141B; --surface:#1A1F2A; --ink:#EEF1F6; --muted:#9AA3B5; --line:#2B3242;
  --h0:#232A37; --h1:#4A3D12; --h2:#7A6015; --h3:#C99A0A; --h4:#F2B705; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#1A1F2A; --ink:#EEF1F6; --muted:#9AA3B5; --line:#2B3242;
  --h0:#232A37; --h1:#4A3D12; --h2:#7A6015; --h3:#C99A0A; --h4:#F2B705; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
.app{max-width:1100px;margin:0 auto;display:grid;gap:16px;grid-template-columns:1fr}
/* wide: full-height app; the room grows to fill the viewport height, the panel scrolls on its own */
@media (min-width:880px){
  :root{--chrome:130px}
  body{padding-block:12px}
  .app{max-width:2400px;grid-template-columns:minmax(0,1fr) clamp(340px,27vw,430px);grid-template-rows:auto minmax(0,1fr);height:calc(100vh - 24px);height:calc(100dvh - 24px);gap:12px 16px}
  h1{font-size:24px}
  .roomcol{align-content:center;justify-items:center;min-height:0}
  .room{width:min(100%,calc((100vh - var(--chrome)) / var(--room-ar,.71)));width:min(100%,calc((100dvh - var(--chrome)) / var(--room-ar,.71)))}
  .toolbar{justify-content:center}
  .panel{overflow:auto;min-height:0;max-height:100%;overscroll-behavior:contain}
}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;grid-column:1/-1}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.5px}
h1 span{color:var(--red)}
.coins{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE38A,#F2B705 55%,#B88700);box-shadow:inset 0 0 0 2px #D69E00;flex:none;display:inline-block}
.coin.sm{width:15px;height:15px}
.roomcol{display:grid;gap:10px;min-width:0}
.room{position:relative;border-radius:20px;background:#0B0E1E;overflow:hidden;min-width:0}
.scroller{overflow:auto;overscroll-behavior:contain;scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}
canvas#room{display:block;touch-action:manipulation;cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.modebar{position:absolute;left:10px;right:10px;bottom:10px;display:grid;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 10px;max-height:60%;overflow:auto}
.modebar .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modebar b{flex:1 1 140px;min-width:0;font-size:14px}
.vchips{display:flex;gap:6px;flex-wrap:wrap}
.vchip{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 10px 4px 5px;font:700 12px var(--body);cursor:pointer;display:flex;align-items:center;gap:5px}
.vchip i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.vchip[aria-pressed="true"]{border-color:var(--yellow)}
/* single column (phones): the edit bar sits under the drawing instead of over it, so the whole room stays visible while placing */
@media (max-width:879px){
  .modebar{position:static;max-height:none;border:0;border-top:2px solid var(--line);border-radius:0;padding:8px 10px 10px}
  .vchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-10px;padding-inline:10px}.vchips::-webkit-scrollbar{display:none}
  .vchip{flex:none}
}
.focus-badge{position:absolute;top:10px;left:10px;color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:5px 12px;background:var(--red)}
.focus-badge.brk{background:var(--green)}
.visit-banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(18,22,38,.82);color:#F4F6FB;font-weight:800;font-size:12px;border-radius:999px;padding:5px 14px;backdrop-filter:blur(4px);max-width:80%;text-align:center}
.pill.on{border-color:var(--yellow);background:var(--yellow);color:var(--yellow-ink)}
.bigcode{font-family:var(--display);font-size:38px;letter-spacing:7px;background:var(--bg);border-radius:14px;padding:12px 8px;margin:2px 0}
.modal input[type=text]{width:100%}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:2px solid var(--line);background:var(--surface);color:var(--ink);font:800 13px var(--body);border-radius:999px;padding:7px 12px;cursor:pointer}
select.pill{appearance:auto}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:800 13px var(--body);padding:9px 2px;border-radius:9px;cursor:pointer;min-width:0}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
button.btn{border:0;border-radius:12px;font:800 15px var(--body);padding:12px 16px;cursor:pointer;background:var(--yellow);color:var(--yellow-ink);box-shadow:0 3px 0 #B88700;transition:transform .08s}
button.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #B88700}
button.btn.ghost{background:var(--bg);color:var(--ink);box-shadow:0 3px 0 var(--line)}
button.btn.danger{background:var(--red);color:#fff;box-shadow:0 3px 0 #8A1F19}
button.btn.go{background:var(--green);color:#fff;box-shadow:0 3px 0 #1D5E3A}
button.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
button.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.timer{display:grid;justify-items:center;gap:12px}
.phase{font-family:var(--display);font-size:20px;letter-spacing:.4px;color:var(--red)}
.phase.brk{color:var(--green)}
.ring{position:relative;width:min(230px,66vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .t strong{font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,58px);font-variant-numeric:tabular-nums;line-height:1}
.ring .t small{color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:800 14px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.chip.sm{padding:5px 11px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--yellow);background:var(--yellow);color:var(--yellow-ink)}
.chip:disabled{opacity:.5;cursor:not-allowed}
.custom{display:flex;align-items:center;gap:8px;font-weight:700}
input[type=number],input[type=text],textarea{font:600 15px var(--body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px}
input[type=number]{width:84px}
textarea{width:100%;min-height:90px;font:500 12px ui-monospace,Menlo,monospace}
.lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.reward{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--muted)}
.mini{font-size:14px;color:var(--muted);font-weight:700;text-align:center}
.soundrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;background:var(--bg);border-radius:12px;padding:10px}
.soundrow select{font:700 14px var(--body);border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface);color:var(--ink)}
.soundrow input[type=range]{flex:1 1 120px;min-width:0;accent-color:var(--yellow)}
.test{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
h2{font-family:var(--display);font-weight:400;font-size:19px;margin:20px 0 10px;letter-spacing:.3px}
section > h2:first-child{margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.card{background:var(--bg);border-radius:14px;padding:8px;display:grid;gap:6px;justify-items:center;text-align:center;align-content:start}
.card canvas{width:110px;height:92px}
.card .n{font-weight:800;font-size:13px;line-height:1.2}
.card .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px}
.tag-s{font-size:11px;color:var(--muted);font-weight:700}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:8px;border:2px solid transparent;cursor:pointer;color:var(--ink);font:700 13px var(--body);text-align:left}
.sw[aria-pressed="true"]{border-color:var(--yellow)}
.sw i{width:40px;height:40px;border-radius:8px;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.sw small{display:flex;align-items:center;gap:4px;color:var(--muted);font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dot{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);cursor:pointer}
.dot[aria-pressed="true"]{box-shadow:0 0 0 3px var(--yellow)}
.sub{font-size:13px;color:var(--muted);margin:-4px 0 8px;line-height:1.45}
.empty{color:var(--muted);text-align:center;padding:18px 8px;line-height:1.5}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:12px 0 0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:14px;padding:12px}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.heatwrap{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;width:max-content}
.heat i{border-radius:3px;background:var(--h0)}
.heat i[data-l="1"]{background:var(--h1)}.heat i[data-l="2"]{background:var(--h2)}.heat i[data-l="3"]{background:var(--h3)}.heat i[data-l="4"]{background:var(--h4)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.week div{display:grid;gap:4px;justify-items:center;align-self:end;font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.week div i{width:100%;max-width:30px;background:var(--yellow);border-radius:6px 6px 2px 2px;min-height:3px}
.week div.today i{background:var(--red)}
.tagbars{display:grid;gap:8px}
.tagbar{display:grid;grid-template-columns:minmax(0,110px) 1fr auto;gap:8px;align-items:center;font-size:13px;font-weight:700}
.tagbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagbar i{height:12px;border-radius:6px;background:var(--yellow);display:block}
.tagbar em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.achs{display:grid;gap:8px}
.ach{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:8px 10px}
.ach .medal{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;font:900 13px var(--body);color:var(--muted)}
.ach.done .medal{background:radial-gradient(circle at 35% 35%,#FFE38A,#F2B705 55%,#B88700);color:#5A3E00}
.ach b{font-size:14px;display:block}
.ach small{color:var(--muted);font-size:12px;font-weight:600}
.ach .prog{height:6px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.ach .prog i{display:block;height:100%;background:var(--yellow)}
.ach em{font-style:normal;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.set{display:grid;gap:10px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.setrow small{display:block;color:var(--muted);font-weight:600;font-size:12px;line-height:1.4}
.switch{width:44px;height:26px;border-radius:13px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{left:21px}
.tagedit{display:flex;flex-wrap:wrap;gap:8px}
.tagedit span{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:5px 6px 5px 12px;font-weight:700;font-size:13px}
.tagedit button{border:0;background:var(--line);color:var(--ink);width:22px;height:22px;border-radius:50%;cursor:pointer;font-weight:900}
.roomrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:8px}
.roomrow input{width:100%;min-width:0}
.roomrow select{font:700 13px var(--body);border:2px solid var(--line);border-radius:10px;padding:6px;background:var(--surface);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center}
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:20px;padding:24px;max-width:380px;width:100%;text-align:center;display:grid;gap:12px;max-height:90vh;overflow:auto}
.modal h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.modal p{margin:0;color:var(--muted);line-height:1.5}
.modal .quote{font-size:17px;color:var(--ink);font-weight:700;line-height:1.4}
.modal .big{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-size:40px}
.modal img{width:100%;border-radius:12px}
/* Focus mode: during a focus session only the room stays, centred and sized to fit the screen. */
.focus-hud{display:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);align-items:center;gap:12px;background:rgba(18,22,38,.78);color:#F4F6FB;border-radius:16px;padding:8px 8px 8px 16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:calc(100% - 24px)}
.hud-t{display:grid;line-height:1.1;min-width:0}
.hud-t strong{font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.hud-t small{font-size:12px;font-weight:700;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.focus-hud .btn{flex:none}
body.focusing header,body.focusing .toolbar,body.focusing .panel,body.focusing .focus-badge{display:none!important}
body.focusing .app{grid-template-columns:1fr;grid-template-rows:none;height:auto;max-width:none;min-height:calc(100vh - 40px);min-height:calc(100dvh - 40px);align-content:center}
body.focusing .roomcol{position:static;animation:focusIn .45s ease-out}
body.focusing .room{width:min(100%,calc((100vh - 60px) / var(--room-ar,1)));width:min(100%,calc((100dvh - 60px) / var(--room-ar,1)));margin-inline:auto}
body.focusing .focus-hud{display:flex}
@keyframes focusIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
/* Phones */
@media (max-width:480px){
  body{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .app{gap:12px}
  h1{font-size:24px}
  .coins{font-size:16px;padding:4px 12px 4px 6px}
  .room{border-radius:16px}
  .toolbar{gap:6px}
  .pill{font-size:12px;padding:6px 10px}
  .panel{padding:12px;border-radius:16px}
  .tabs{gap:2px;margin-bottom:12px}
  .tabs button{font-size:12px;padding:9px 0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
  .card canvas{width:96px;height:80px}
  .swatches{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .kpi b{font-size:22px}
  .modal{padding:18px}
  .hud-t strong{font-size:26px}
}
/* iOS zooms into inputs under 16px */
@media (pointer:coarse){input[type=number],input[type=text],textarea,select{font-size:16px!important}}
.overlay{padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.modal{max-height:90vh;max-height:90dvh}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header>
    <h1>Pomo<span>Room</span></h1>
    <div class="coins" title="Monedas"><span class="coin"></span><span id="coins">0</span></div>
  </header>

  <div class="roomcol">
    <div class="room" id="roomWrap">
      <div class="scroller" id="scroller"><canvas id="room" aria-label="Tu habitación"></canvas></div>
      <div class="focus-badge" id="focusBadge" hidden>Enfocando…</div>
      <div class="focus-hud" id="focusHud"><div class="hud-t"><strong id="hudClock">25:00</strong><small id="hudSub"></small></div><button class="btn danger sm" id="hudBtn">Rendirse</button></div>
      <div class="visit-banner" id="visitBanner" hidden></div>
      <div class="modebar" id="modebar" hidden></div>
    </div>
    <div class="toolbar">
      <select class="pill" id="roomSel" aria-label="Habitación"></select>
      <button class="pill" id="lightBtn">Luz: automática</button>
      <button class="pill" id="weatherBtn">Clima: automático</button>
      <button class="pill" id="roomBtn">Salas</button>
      <button class="pill" id="photoBtn">Foto</button>
    </div>
  </div>

  <div class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-focus" aria-selected="true">Enfocar</button>
      <button role="tab" id="tab-shop" aria-selected="false">Tienda</button>
      <button role="tab" id="tab-inv" aria-selected="false">Cosas</button>
      <button role="tab" id="tab-prog" aria-selected="false">Progreso</button>
      <button role="tab" id="tab-set" aria-selected="false">Ajustes</button>
    </div>

    <section id="view-focus">
      <div class="timer">
        <div class="phase" id="phase">Enfoque</div>
        <div class="ring">
          <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/>
            <circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--red)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="0"/></svg>
          <div class="t"><strong id="clock">25:00</strong><small id="clockSub">listo para empezar</small></div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="custom" id="customBox" hidden><input type="number" id="customMin" min="5" max="180" step="5" value="50"> minutos</div>
        <div class="lbl">Materia</div>
        <div class="chips" id="tagChips"></div>
        <div class="reward" id="reward"></div>
        <button class="btn" id="startBtn">Empezar a enfocar</button>
        <div class="mini" id="miniStats"></div>
        <div class="soundrow">
          <label class="lbl" for="soundSel">Sonido</label>
          <select id="soundSel"><option value="off">Silencio</option><option value="lluvia">Lluvia</option><option value="blanco">Ruido blanco</option><option value="marron">Ruido marrón</option><option value="chimenea">Chimenea</option><option value="olas">Olas</option></select>
          <input type="range" id="soundVol" min="0" max="1" step="0.05" aria-label="Volumen">
        </div>
        <label class="test"><input type="checkbox" id="testMode"> Modo prueba (1 minuto dura 1 segundo)</label>
      </div>

function inPoly(px,py,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)c=!c;}return c;}

const SND={ac:null,nodes:[],timer:null,gain:null};
function noiseBuf(ac,type){const len=ac.sampleRate*4,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);let last=0,b0=0,b1=0,b2=0;

  const ac=SND.ac||(SND.ac=new (window.AudioContext||window.webkitAudioContext)());ac.resume();
  const g=ac.createGain();g.gain.value=S.sound.vol;g.connect(ac.destination);SND.gain=g;SND.nodes.push(g);
  const src=ac.createBufferSource();src.loop=true;SND.nodes.push(src);
  const burst=(gain,hp,len)=>{const s=ac.createBufferSource(),bf=ac.createBuffer(1,Math.floor(ac.sampleRate*len),ac.sampleRate),d=bf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    s.buffer=bf;const f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=hp;const gg=ac.createGain();gg.gain.value=gain;s.connect(f).connect(gg).connect(g);s.start();};

  if(type==="blanco"){src.buffer=noiseBuf(ac,"white");const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=9000;src.connect(f).connect(g);}
  if(type==="marron"){src.buffer=noiseBuf(ac,"brown");src.connect(g);}
  if(type==="chimenea"){src.buffer=noiseBuf(ac,"brown");const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=500;const gg=ac.createGain();gg.gain.value=.7;src.connect(f).connect(gg).connect(g);
    SND.timer=setInterval(()=>{if(Math.random()<.35)burst(.15+Math.random()*.35,1200,.012+Math.random()*.03);},110);}
  if(type==="olas"){src.buffer=noiseBuf(ac,"pink");const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=1200;const amp=ac.createGain();amp.gain.value=.55;
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.09;lg.gain.value=.45;lfo.connect(lg).connect(amp.gain);lfo.start();SND.nodes.push(lfo);src.connect(f).connect(amp).connect(g);}
  src.start();}

// ================= online: identity, nickname, shared rooms =================
// Identity comes from claude.ai (the viewer is already signed in); the page only
// stores an opaque id plus the nickname the person types. Live company runs on the
// `room` capability; a shared room's layout lives in `db` so it survives the host leaving.
const CODE_ABC="abcdefghjkmnpqrstuvwxyz23456789";
const ON={user:null,db:null,room:null,id:null,nick:"",chan:null,code:null,host:false,
  visit:null,peers:new Map(),stamp:0,pushT:0,profiles:{},err:""};
let TAGS=[];
function newCode(){let c="";for(let i=0;i<6;i++)c+=CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)];return c;}
const showCode=c=>c.toUpperCase();
const myNick=()=>ON.nick||S.nick||"Tú";
function figOf(){const f=S.fig;return{shirt:f.shirt,pants:f.pants,hair:f.hair,skin:f.skin,pelo:f.pelo||0,gafas:!!f.gafas,bata:!!f.bata};}
function figFrom(o){o=o&&typeof o==="object"?o:{};const pick=(v,d)=>typeof v==="string"&&/^#[0-9a-fA-F]{3,8}$/.test(v)?v:d;
  const sh=pick(o.shirt,"#C8342B"),ba=!!o.bata;
  return{top:ba?"#F4F4F4":sh,shirt:sh,pants:pick(o.pants,"#2B3A55"),hair:pick(o.hair,"#3A2416"),skin:pick(o.skin,"#F7D117"),
    bata:ba,pelo:Math.max(0,Math.min(4,o.pelo|0)),gafas:!!o.gafas};}
const cleanNick=v=>{let o="";const t=String(v==null?"":v);for(const ch of t){const c=ch.codePointAt(0);if(c<32||(c>=127&&c<160)||(c>=0x200b&&c<=0x200f)||(c>=0x2028&&c<=0x202f)||(c>=0x2060&&c<=0x2064)||c===0xfeff)continue;o+=ch;}return o.trim().slice(0,16);};

async function initOnline(){
  const use=async n=>{try{return (window.claude&&window.claude.use)?await window.claude.use(n):null;}catch(e){return null;}};
  ON.user=await use("user");ON.db=await use("db");ON.room=await use("room");
  if(ON.user){try{const me=await ON.user.me();ON.id=me.id;if(!S.nick&&me.name)S.nick=cleanNick(me.name);}catch(e){}}
  if(ON.db&&ON.id){try{const d=await ON.db.doc("nicks/"+ON.id).get();const n=d.exists&&cleanNick(d.data().nick);if(n&&!S.nick)S.nick=n;}catch(e){}}
  window.ONOK=true;ON.nick=S.nick||"";save();
  if(!S.nickSet)setTimeout(askNick,700);
  renderRoomBtn();
}
async function saveNick(n){S.nick=cleanNick(n);S.nickSet=true;ON.nick=S.nick;save();
  if(ON.db&&ON.id){try{await ON.db.doc("nicks/"+ON.id).set({nick:S.nick,at:Date.now()});}catch(e){}}
  if(ON.chan)pushPresence(true);
  if(!document.getElementById("view-set").hidden)renderSet();}
function askNick(){const o=modal(`<h3>¿Cómo te llamas?</h3><p>Tu apodo aparece sobre tu personaje y lo ven tus amigos cuando visitan tu habitación.</p>

// ---- live presence ----
function pushPresence(force){if(!ON.chan)return;const now=performance.now();if(!force&&now-ON.pushT<150)return;ON.pushT=now;
  const m=figMode(),st=m==="focus"?"focus":m==="break"?"break":FIG.state==="walk"?"walk":"idle";
  const p={nick:myNick(),x:Math.round(FIG.x*100)/100,y:Math.round(FIG.y*100)/100,dir:FIG.dir|0,st,fig:figOf()};
  if(ON.id)p.uid=ON.id;
  try{ON.chan.presence(p);}catch(e){}}
function readPeers(ch){const list=ch.peers?ch.peers():[];const seen=new Set();
  for(const pr of list){if(pr.isMe||pr.kind!=="viewer")continue;const pz=pr.presence||{};if(typeof pz.x!=="number"||typeof pz.y!=="number")continue;
    seen.add(pr.peer);let e=ON.peers.get(pr.peer);
    if(!e){e={x:pz.x,y:pz.y,dir:0,st:"idle",nick:"",fig:figFrom(null),by:pr.by||pz.uid||null,guest:!!pr.guest};ON.peers.set(pr.peer,e);}
    e.tx=pz.x;e.ty=pz.y;e.dir=pz.dir|0;e.st=typeof pz.st==="string"?pz.st:"idle";
    e.nick=cleanNick(pz.nick)||"Visitante";e.fig=figFrom(pz.fig);e.by=pr.by||(typeof pz.uid==="string"?pz.uid:null);e.guest=!!pr.guest;}
  for(const k of [...ON.peers.keys()])if(!seen.has(k))ON.peers.delete(k);}
function stepPeers(dt){for(const e of ON.peers.values()){const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy);
  if(d>2.5){e.x=e.tx;e.y=e.ty;}else if(d>.002){const s=Math.min(d,Math.max(1.6,d*6)*dt);e.x+=dx/d*s;e.y+=dy/d*s;}}}
function peerBoxes(t){const out=[];let i=0;
  for(const e of ON.peers.values()){i++;const f=e.fig,gz=groundAt(e.x,e.y),blink=((t+i*.7)%3.9)<.13,br=Math.sin(t*2.2+i)*.006;
    const moving=Math.hypot(e.tx-e.x,e.ty-e.y)>.02||e.st==="walk";
    let bs;
    if(e.st==="focus")bs=cellBoxes(figFloorSit(f,br,blink),Math.round(e.x),Math.round(e.y),e.dir,-3,gz);
    else if(e.st==="break")bs=cellBoxes(figStand(f,{up:1,blink,breath:br}),e.x,e.y,1,-3,gz+(REDUCED?0:Math.abs(Math.sin(t*2.6+i))*.05));
    else if(moving){const s=Math.sin(t*10.5+i);bs=cellBoxes(figStand(f,{s,blink}),e.x,e.y,e.dir,-3,gz+(1-Math.abs(s))*.018);}
    else bs=cellBoxes(figStand(f,{blink,breath:br,look:Math.sin(t*.7+i)*.025}),e.x,e.y,e.dir,-3,gz);
    softShadow(e.x+.5,e.y+.5,.4,gz);out.push(...bs);TAGS.push(tagAt(bs,e.nick,false));}
  return out;}
function tagAt(bs,text,me){let mx=0,my=0,mz=0,n=0;for(const b of bs){mx+=b.x+b.w/2;my+=b.y+b.d/2;n++;mz=Math.max(mz,b.z+b.h);}
  return{x:n?mx/n:0,y:n?my/n:0,z:mz+.12,text,me};}
function drawTags(){if(!TAGS.length)return;const fs=Math.max(10,Math.round(P.tw*.17));
  ctx.save();ctx.font=`800 ${fs}px Nunito, system-ui, sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
  const laid=[];
  for(const g of TAGS){if(!g.text)continue;let [sx,sy]=pt(P,g.x,g.y,g.z);const w=ctx.measureText(g.text).width,pad=fs*.45,h=fs*1.5;
    for(let n=0;n<6;n++){const hit=laid.some(o=>Math.abs(o.sx-sx)<(o.w+w)/2+pad*2&&Math.abs(o.sy-sy)<h*1.1);if(!hit)break;sy-=h*1.15;}
    laid.push({sx,sy,w});
    ctx.fillStyle=g.me?"rgba(242,183,5,.95)":"rgba(18,22,38,.82)";
    const x0=sx-w/2-pad,y0=sy-h,r=h*.42;
    ctx.beginPath();ctx.moveTo(x0+r,y0);ctx.arcTo(x0+w+2*pad,y0,x0+w+2*pad,y0+h,r);ctx.arcTo(x0+w+2*pad,y0+h,x0,y0+h,r);
    ctx.arcTo(x0,y0+h,x0,y0,r);ctx.arcTo(x0,y0,x0+w+2*pad,y0,r);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(sx-fs*.22,y0+h-1);ctx.lineTo(sx,y0+h+fs*.3);ctx.lineTo(sx+fs*.22,y0+h-1);ctx.fill();
    ctx.fillStyle=g.me?"#2E2300":"#F4F6FB";ctx.fillText(g.text,sx,y0+h/2);}
  ctx.restore();}

// ---- rooms ----
function roomPayload(){const r=S.rooms[S.cur];
  return{host:ON.id||null,hostNick:myNick(),size:r.size,name:r.name,
    floorStyle:r.floorStyle,floorColor:r.floorColor,wallStyle:r.wallStyle,wallColor:r.wallColor,
    placed:r.placed.map(p=>({uid:p.uid,id:p.id,x:p.x,y:p.y,r:p.r|0,z:p.z||0,v:p.v|0})).filter(p=>CATALOG[p.id]),
    walls:r.walls.map(w=>({uid:w.uid,id:w.id,wall:w.wall,s:w.s,z:w.z,v:w.v|0,txt:w.txt||null})).filter(w=>WCAT[w.id]),
    at:Date.now()};}
function layoutFrom(d){const n=Math.max(6,Math.min(10,d.size|0||8));
  const ok=v=>typeof v==="string"&&/^#[0-9a-fA-F]{3,8}$/.test(v);
  return{name:typeof d.name==="string"?d.name.slice(0,30):"Habitación",size:n,
    floorStyle:STYLES.floor.some(t=>t.id===d.floorStyle)?d.floorStyle:"lego",floorColor:ok(d.floorColor)?d.floorColor:"#C9965B",
    wallStyle:STYLES.wall.some(t=>t.id===d.wallStyle)?d.wallStyle:"lego",wallColor:ok(d.wallColor)?d.wallColor:"#EAD9BC",
    placed:(Array.isArray(d.placed)?d.placed:[]).filter(p=>p&&CATALOG[p.id]).slice(0,120).map(p=>({uid:p.uid|0,id:p.id,x:p.x|0,y:p.y|0,r:p.r|0,z:+p.z||0,v:p.v|0})),
    walls:(Array.isArray(d.walls)?d.walls:[]).filter(w=>w&&WCAT[w.id]).slice(0,40).map(w=>({uid:w.uid|0,id:w.id,wall:w.wall==="left"?"left":"back",s:+w.s||0,z:+w.z||1,v:w.v|0,txt:typeof w.txt==="string"?w.txt:undefined}))};}
let pushTimer=null;
function pushLayout(){if(!ON.host||!ON.db||!ON.code)return;clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ON.db.doc("rooms/"+ON.code).set(roomPayload()).catch(()=>{});},900);}
async function joinChannel(code){if(ON.chan){try{await ON.chan.leave();}catch(e){}ON.chan=null;}
  ON.peers.clear();if(!ON.room)return false;
  try{const ch=await ON.room.join(code);ON.chan=ch;ch.onPeers(()=>readPeers(ch),()=>{});pushPresence(true);return true;}
  catch(e){ON.err=e&&e.code||"error";return false;}}
async function hostRoom(){if(!ON.db){toast("Necesitas tener la sesión de claude.ai abierta para crear salas");return;}
  const code=S.myCode||newCode();S.myCode=code;save();
  try{await ON.db.doc("rooms/"+code).set(roomPayload());}catch(e){toast("No se pudo crear la sala");return;}
  ON.code=code;ON.host=true;await joinChannel(code);renderRoomBtn();roomPanel();}
async function leaveRoom(){if(ON.chan){try{await ON.chan.leave();}catch(e){}}
  ON.chan=null;ON.code=null;ON.host=false;ON.peers.clear();
  if(ON.visit){ON.visit=null;RM=S.rooms[S.cur];N=RM.size;computeWins();placing=null;selUid=null;selW=null;PETS.clear();FIG.path=[];STATIC.key="";layout();renderRoomSel();}
  renderRoomBtn();}
async function joinRoom(raw){const code=String(raw||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,6);
  if(code.length<6){toast("El código tiene 6 caracteres");return;}
  if(!ON.db){toast("Necesitas tener la sesión de claude.ai abierta para entrar a una sala");return;}
  let snap;try{snap=await ON.db.doc("rooms/"+code).get();}catch(e){toast("No se pudo leer esa sala");return;}
  if(!snap.exists){toast("No encontré esa sala. Revisa el código.");return;}
  const d=snap.data()||{};if(ON.host&&code===ON.code){toast("Esa es tu propia sala");return;}
  if(ON.chan){try{await ON.chan.leave();}catch(e){}ON.chan=null;}
  ON.host=false;ON.code=code;ON.visit={code,hostNick:cleanNick(d.hostNick)||"Anfitrión",hostId:typeof d.host==="string"?d.host:null};
  RM=layoutFrom(d);N=RM.size;computeWins();placing=null;selUid=null;selW=null;hover=null;PETS.clear();
  FIG.x=Math.min(FIG.x,N-1);FIG.y=Math.min(FIG.y,N-1);FIG.path=[];STATIC.key="";layout();updateBar();
  await joinChannel(code);renderRoomBtn();
  toast(`Estás en la habitación de ${ON.visit.hostNick}`);}

function renderRoomBtn(){const b=document.getElementById("roomBtn");if(!b)return;
  if(!ON.room&&!ON.db){b.hidden=true;return;}b.hidden=false;
  b.textContent=ON.visit?`Visitando: ${ON.visit.hostNick}`:ON.host?`Sala ${showCode(ON.code)}`:"Salas";
  b.classList.toggle("on",!!ON.code);
  const sel=document.getElementById("roomSel");if(sel)sel.disabled=!!ON.visit;
  const banner=document.getElementById("visitBanner");
  if(banner){banner.hidden=!ON.visit;if(ON.visit)banner.textContent=`Visitando la habitación de ${ON.visit.hostNick}`;}}
function peerLine(){const n=ON.peers.size;return n?`${n} ${n===1?"persona conectada":"personas conectadas"} ahora`:"Nadie más conectado todavía";}
function roomPanel(){
  const can=!!ON.db,mine=S.myCode&&ON.host;
  let body;
  if(ON.visit)body=`<h3>De visita</h3><p>Estás en la habitación de <b>${escapeHtml(ON.visit.hostNick)}</b>, código <b>${showCode(ON.visit.code)}</b>.</p>
    <p>${peerLine()}. Tu personaje camina por aquí y los demás lo ven con tu apodo.</p>
    <button class="btn" data-g="leave">Volver a mi habitación</button><button class="btn ghost" data-g="x">Seguir aquí</button>`;
  else if(ON.host)body=`<h3>Tu sala está abierta</h3><p>Pásale este código a quien quieras invitar, junto con el enlace de la app:</p>
    <div class="bigcode">${showCode(ON.code)}</div>
    <p>${peerLine()}. Cuando entren, sus personajes aparecen caminando aquí.</p>
    <button class="btn" data-g="copy">Copiar código</button><button class="btn ghost" data-g="close">Cerrar la sala</button><button class="btn ghost" data-g="x">Listo</button>`;
  else body=`<h3>Salas compartidas</h3>${can?"":`<p>Para usar salas necesitas abrir esta página con tu sesión de claude.ai iniciada.</p>`}
    <p>Abre tu habitación para que tus amigos entren con un código, o entra a la de alguien más.</p>
    <button class="btn" data-g="host" ${can?"":"disabled"}>Abrir mi habitación</button>
    <div class="lbl" style="margin-top:6px">Entrar con código</div>
    <input type="text" id="joinIn" maxlength="7" placeholder="ABC123" style="text-transform:uppercase;text-align:center;letter-spacing:3px;font-weight:900">
    <button class="btn ghost" data-g="join" ${can?"":"disabled"}>Entrar</button><button class="btn ghost" data-g="x">Cancelar</button>`;
  const o=modal(body);
  const q=g=>o.querySelector(`[data-g="${g}"]`);
  if(q("host"))q("host").onclick=()=>{o.remove();hostRoom();};
  if(q("join"))q("join").onclick=()=>{const v=o.querySelector("#joinIn").value;o.remove();joinRoom(v);};
  const ji=o.querySelector("#joinIn");if(ji)ji.onkeydown=e=>{if(e.key==="Enter"){const v=ji.value;o.remove();joinRoom(v);}};
  if(q("leave"))q("leave").onclick=()=>{o.remove();leaveRoom();toast("Volviste a tu habitación");};
  if(q("close"))q("close").onclick=()=>{o.remove();if(ON.db&&ON.code)ON.db.doc("rooms/"+ON.code).delete().catch(()=>{});leaveRoom();toast("Sala cerrada");};
  if(q("copy"))q("copy").onclick=()=>{const t=showCode(ON.code);
    try{navigator.clipboard.writeText(t).then(()=>toast("Código copiado"),()=>toast("Copia el código a mano: "+t));}catch(e){toast("Copia el código a mano: "+t);}};}

if(FREE)document.querySelector(".coins").hidden=true;
// relayout only when the room's width changes: on phones the URL bar showing/hiding fires height-only resizes
let relayout=0;
const onResize=()=>{if((P&&scroller.clientWidth===P.ox*2/ZOOM)||relayout)return;relayout=requestAnimationFrame(()=>{relayout=0;layout();});};
if(window.ResizeObserver)new ResizeObserver(onResize).observe(scroller);else window.addEventListener("resize",onResize);
document.getElementById("roomBtn").onclick=()=>roomPanel();
renderRoomSel();renderChips();refresh();layout();tick();initOnline();
setInterval(tick,250);setInterval(()=>{STATS=computeStats();},60000);
requestAnimationFrame(loop);
document.fonts?.ready.then(()=>{STATIC.key="";});
</script>
